name: PR labels

# The generated release notes group pull requests by these labels; see
# .github/release.yml. The labels are derived from the pull request title, which the
# "Validate PR title" check already gates, instead of being maintained by hand.
#
# pull_request_target lets this workflow label pull requests from forks: it never
# checks out or runs pull request code, and only reads the title and body from the
# event payload before calling the labels API.
on:
  pull_request_target:
    types: [opened, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply type labels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Label the pull request from its Conventional Commit title
        uses: actions/github-script@v7
        with:
          script: |
            const typeLabels = [
              'feat', 'fix', 'docs', 'style', 'refactor', 'perf',
              'test', 'build', 'ci', 'chore', 'revert',
            ];
            const managed = ['breaking', ...typeLabels];

            const pullRequest = context.payload.pull_request;
            const title = pullRequest.title;
            const body = pullRequest.body ?? '';

            // <type>[(<scope>)][!]: <description> — the header enforced by pr-title.yml.
            const header = title.match(/^([a-z]+)(?:\([^)]*\))?(!)?: /);
            if (!header) {
              core.info(`"${title}" is not a Conventional Commit header; leaving labels alone.`);
              return;
            }

            const desired = new Set();
            if (typeLabels.includes(header[1])) {
              desired.add(header[1]);
            }
            if (header[2] || /(^|\n)BREAKING[ -]CHANGE:/.test(body)) {
              desired.add('breaking');
            }

            const current = pullRequest.labels.map((label) => label.name);
            const stale = managed.filter((name) => current.includes(name) && !desired.has(name));
            const missing = [...desired].filter((name) => !current.includes(name));

            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            if (missing.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                labels: missing,
              });
            }

            core.info(`Applied labels: ${[...desired].join(', ') || '(none)'}`);

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by design: no job in this workflow writes to the repository.
permissions:
  contents: read

env:
  # Toolchain pins. `mise run lint` compares swift-format output, so CI has to run
  # the exact versions CONTRIBUTING.md documents — a different formatter build reports
  # unrelated drift and the gate stops meaning anything. Each job asserts these values
  # and fails with an actionable message instead of silently formatting with a
  # different toolchain. SwiftLint is pinned in `.mise.toml` and installed through
  # jdx/mise-action in the lint job.
  PINNED_XCODE: "27.2"
  PINNED_SWIFT: "6.4.2"
  PINNED_SWIFT_FORMAT: "6.4.4"

jobs:
  build-test:
    name: Build & test
    # Static checks come first: do not spend build minutes on a tree that lints,
    # formats or commits incorrectly.
    needs: [lint, conventional-commits]
    # The `xcode-27` image is the only GitHub-hosted image that carries Xcode 27.x.
    # It is a public preview for now; see README "Continuous integration" for the
    # fallback if the label or the pinned Xcode disappears.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin toolchain
        run: |
          set -euo pipefail
          xcode="/Applications/Xcode_${PINNED_XCODE}.app"
          if [[ ! -d "$xcode" ]]; then
            echo "::error::Xcode ${PINNED_XCODE} is missing from this runner image. Update PINNED_* in .github/workflows/ci.yml."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"

          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          swift_version="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          format_version="$(xcrun swift-format --version | head -1 | tr -d '[:space:]')"
          echo "xcode=${xcode_version} swift=${swift_version} swift-format=${format_version}"

          [[ "$xcode_version" == "$PINNED_XCODE" ]] \
            || { echo "::error::Xcode drift: pinned ${PINNED_XCODE}, found ${xcode_version}."; exit 1; }
          [[ "$swift_version" == "$PINNED_SWIFT" ]] \
            || { echo "::error::Swift drift: pinned ${PINNED_SWIFT}, found ${swift_version}."; exit 1; }
          [[ "$format_version" == "$PINNED_SWIFT_FORMAT" ]] \
            || { echo "::error::swift-format drift: pinned ${PINNED_SWIFT_FORMAT}, found ${format_version}."; exit 1; }

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-swift${{ env.PINNED_SWIFT }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-swift${{ env.PINNED_SWIFT }}-

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test (debug, parallel)
        run: swift test --parallel

  lint:
    name: Lint & format
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      # Only SwiftLint comes from mise; Swift and swift-format are provided by the
      # Xcode image pinned below.
      MISE_ENABLE_TOOLS: swiftlint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin toolchain
        run: |
          set -euo pipefail
          xcode="/Applications/Xcode_${PINNED_XCODE}.app"
          if [[ ! -d "$xcode" ]]; then
            echo "::error::Xcode ${PINNED_XCODE} is missing from this runner image. Update PINNED_* in .github/workflows/ci.yml."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"

          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          format_version="$(xcrun swift-format --version | head -1 | tr -d '[:space:]')"
          echo "xcode=${xcode_version} swift-format=${format_version}"

          [[ "$xcode_version" == "$PINNED_XCODE" ]] \
            || { echo "::error::Xcode drift: pinned ${PINNED_XCODE}, found ${xcode_version}."; exit 1; }
          [[ "$format_version" == "$PINNED_SWIFT_FORMAT" ]] \
            || { echo "::error::swift-format drift: pinned ${PINNED_SWIFT_FORMAT}, found ${format_version}."; exit 1; }

      # SwiftLint is pinned in `.mise.toml`; mise installs exactly that version.
      # MISE_ENABLE_TOOLS keeps the install to SwiftLint, so the Xcode image's Swift
      # and swift-format stay the ones asserted in the "Pin toolchain" step.
      - name: Install pinned tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.6
          cache_key_prefix: mise-${{ env.MISE_ENABLE_TOOLS }}

      - name: Lint and format
        run: mise run lint

  conventional-commits:
    name: Conventional Commits
    # Shell and git only: no toolchain, no build, so the cheap runner is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Validate every non-merge commit the pull request adds on top of its base
            # branch. The validator lives in scripts/, so it is versioned with the repo.
            git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            range="origin/${BASE_REF}..HEAD"
          elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            # First push to the branch, or a rewritten history: fall back to the whole
            # range below the checked-out commit.
            root="$(git rev-list --max-parents=0 HEAD | tail -1)"
            range="${root}..HEAD"
          fi

          echo "Validating commit messages in ${range}"
          ./scripts/validate-conventional-commits.sh --range "$range"
